name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Lint
        run: uvx ruff@0.16.2 check src tests
      - name: Format check
        run: uvx ruff@0.16.2 format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        # CPU-only torch: the runners have no GPU, and the CUDA wheel is a ~2.5GB
        # download that would dominate CI time for no added coverage.
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --index-strategy unsafe-best-match \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -e ".[dev]"

      - name: Test
        run: uv run pytest tests -q --durations=10

  end-to-end:
    # Proves the pipeline actually runs, not just that its parts type-check:
    # prepare a corpus, train, resume, evaluate, generate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: |
          uv venv --python 3.11
          uv pip install --index-strategy unsafe-best-match \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -e ".[dev]"

      - name: Prepare a small corpus
        run: |
          uv run llmfs-prepare-data --source text \
            --input data/wizard_of_oz.txt --out-dir data/wizard --shard-tokens 40000

      - name: Train
        run: |
          uv run llmfs-train --config debug \
            --set runtime.device=cpu --set train.max_steps=20 \
            --set log.eval_interval=10 --set log.tensorboard=false \
            --set log.out_dir=ci-out

      - name: Resume from the last checkpoint
        run: |
          uv run llmfs-train --config debug --resume auto \
            --set runtime.device=cpu --set train.max_steps=30 \
            --set log.eval_interval=10 --set log.tensorboard=false \
            --set log.out_dir=ci-out

      - name: Evaluate and generate
        run: |
          uv run llmfs-eval --checkpoint ci-out/debug/final.pt --device cpu --max-batches 4
          uv run llmfs-generate --checkpoint ci-out/debug/final.pt \
            --prompt "Dorothy" --max-new-tokens 16 --seed 0 --device cpu

      - name: Build the attention explorer
        run: |
          uv run llmfs-viz --checkpoint ci-out/debug/final.pt \
            --out ci-out/attention.html --device cpu
          test -s ci-out/attention.html
