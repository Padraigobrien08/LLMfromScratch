name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default rather than whatever the repository default happens to be. No job
# here writes anything; `pages.yml` asks for the extra scopes it needs, and asks for them
# there rather than inheriting them everywhere.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned to an exact version, not `@v9`: setup-uv stopped publishing major and
      # minor tags at v8, so a major-tag pin here 404s. `prune-cache` is stated because
      # v9 flipped its default to false, and this repo's uv cache holds torch wheels —
      # unpruned it grows into the same 10GB budget the demo checkpoint cache uses.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - name: Lint
        run: uvx ruff@0.16.2 check src tests
      - name: Format check
        run: uvx ruff@0.16.2 format --check src tests
      - name: Lockfile is in sync with pyproject.toml
        # Without this the committed lock silently drifts from the declared
        # dependencies, and "pinned" stops meaning anything.
        run: uv lock --check

  # `uv lock --check` proves the lock *agrees with* pyproject.toml. It does not prove the
  # locked versions install and work together, and nothing did: every other job here
  # installs with `uv pip install -e .`, which re-resolves the `>=` ranges and can quietly
  # pick versions the lock has never seen. So a locked environment is built once and the
  # suite is run inside it. This job is the slow one — the linux torch wheel in the lock
  # is the CUDA build, several GB — which is why it is one job at one Python version
  # rather than part of the matrix below, and why the uv cache is keyed on uv.lock.
  locked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock
      - name: Install exactly what the lockfile says
        run: uv sync --locked --extra dev
      - name: The locked environment must pass the suite
        env:
          LLMFS_REQUIRE_VOCAB: "1"
          LLMFS_REQUIRE_WEB: "1"
        run: uv run --no-sync pytest tests -q

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        # CPU-only torch: the runners have no GPU, and the CUDA wheel is a ~2.5GB
        # download that would dominate CI time for no added coverage.
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --index-strategy unsafe-best-match \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -e ".[dev]"

      - name: Test
        # LLMFS_REQUIRE_VOCAB turns "GPT-2 vocabulary unavailable, skipping" into a
        # failure. The runner has a network, so a skip here means the vocab-size pin,
        # the Python half of the bidirectional tokenizer pin and the attention-viz
        # tests silently did not run — which used to look identical to passing.
        # LLMFS_REQUIRE_WEB does the same for the web-export freshness tests, whose
        # module otherwise skips itself whenever web/src/content is not where it
        # expects — a layout change would turn every staleness guarantee into a pass.
        #
        # `--no-sync`, because a bare `uv run` in a project with a lockfile syncs the
        # environment to the lock before executing — measured in run 32422469495, where
        # this step downloaded the 502MiB default torch wheel over the CPU one the
        # Install step had just placed. Without the flag this job tests the locked
        # resolution, which the `locked` job already covers, and the fresh `>=`
        # coverage this matrix exists for does not happen.
        env:
          LLMFS_REQUIRE_VOCAB: "1"
          LLMFS_REQUIRE_WEB: "1"
        run: uv run --no-sync pytest tests -q --durations=10

  site:
    # The site ships a second implementation of the rotation math, in TypeScript,
    # so it can run in a browser. These tests are what stop it drifting into a
    # picture of something the model does not do.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --prefix web
      - name: Test
        run: npm test --prefix web
      - name: Generated test count is current
        # The one field of web/src/content/measured.ts that the Python job cannot
        # re-derive, because enumerating the vitest suite needs this toolchain.
        run: npm run check:counts --prefix web
      - name: Type-check and build
        run: npm run build --prefix web

  end-to-end:
    # Proves the pipeline actually runs, not just that its parts type-check:
    # prepare a corpus, train, resume, evaluate, generate. The steps assert what the
    # words claim — the resume picks up at the trained step, the loss ends finite and
    # below an untrained model's, the generator emits text — because "exit code 0"
    # would also be satisfied by a trainer that restarted from scratch or a generator
    # that printed nothing.
    runs-on: ubuntu-latest
    env:
      # Every `uv run` below would otherwise sync the venv to the lockfile, replacing
      # the CPU torch wheel the Install step chose with the multi-GB default one.
      # See the matrix job's Test step for the measured instance.
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: |
          uv venv --python 3.11
          uv pip install --index-strategy unsafe-best-match \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -e ".[dev]"

      - name: Prepare a small corpus
        run: |
          uv run llmfs-prepare-data --source text \
            --input data/wizard_of_oz.txt --out-dir data/wizard --shard-tokens 40000

      - name: Train
        run: |
          uv run llmfs-train --config debug \
            --set runtime.device=cpu --set train.max_steps=20 \
            --set log.eval_interval=10 --set log.tensorboard=false \
            --set log.out_dir=ci-out

      - name: Resume from the last checkpoint
        # The tee+grep is the point of the step: a trainer that silently started over
        # from step 0 would also exit 0 and also write a final.pt.
        run: |
          uv run llmfs-train --config debug --resume auto \
            --set runtime.device=cpu --set train.max_steps=30 \
            --set log.eval_interval=10 --set log.tensorboard=false \
            --set log.out_dir=ci-out | tee resume.log
          grep -F "[resume]" resume.log
          grep -F "at step 20" resume.log

      - name: The resumed run reached step 30 and the model learned something
        # Read from metrics.jsonl, the same artifact the ablation analysis trusts.
        # 10.5 is below ln(50,257) ≈ 10.82, the loss of a model that has learned
        # nothing — a weak bar on purpose: 30 CPU steps prove direction, not quality.
        run: |
          uv run python - <<'EOF'
          import json, math
          rows = [json.loads(line) for line in open("ci-out/debug/metrics.jsonl")]
          steps = [r["step"] for r in rows]
          assert max(steps) >= 30, f"run stopped at step {max(steps)}, expected 30"
          vals = [r["val/loss"] for r in rows if "val/loss" in r]
          assert vals, "no validation losses were logged"
          assert all(math.isfinite(v) for v in vals), f"non-finite val loss: {vals}"
          assert vals[-1] < 10.5, f"final val loss {vals[-1]:.3f} is no better than untrained"
          EOF

      - name: Evaluate and generate
        run: |
          uv run llmfs-eval --checkpoint ci-out/debug/final.pt --device cpu --max-batches 4
          uv run llmfs-generate --checkpoint ci-out/debug/final.pt \
            --prompt "Dorothy" --max-new-tokens 16 --seed 0 --device cpu | tee gen.log
          grep -F "[1] Dorothy" gen.log
          test "$(wc -c < gen.log)" -ge 100

      - name: Build the attention explorer
        run: |
          uv run llmfs-viz --checkpoint ci-out/debug/final.pt \
            --out ci-out/attention.html --device cpu
          test -s ci-out/attention.html
