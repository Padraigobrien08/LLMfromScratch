name: Deploy site

# Builds the interactive site and the attention explorer, and publishes both to
# GitHub Pages: the React site at the root, the explorer at /attention/.
#
# The page is generated from a checkpoint this workflow trains itself, so what is
# hosted is always a real model produced by the current code — never a stale artifact
# committed months ago. The model is deliberately tiny and the page's own header
# reports its size, step count and validation loss, so a viewer can see exactly what
# they are looking at.
#
# Training dominates this job (measured: 1,248s of a 1,282s run), so the checkpoint is
# cached against the config and the source that actually determines it. A push that
# only touches the front end, docs or tests reuses the cached model and the whole job
# finishes in well under a minute; the training path runs only when the model would
# genuinely differ.
#
# Requires Pages to be enabled for the repository with "GitHub Actions" as the source
# (Settings -> Pages -> Build and deployment -> Source). Without it the deploy step
# fails with "Ensure GitHub Pages has been enabled".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DEMO_STEPS: "200"
  DEMO_TOKENS_PER_STEP: "4096"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Exact version rather than `@v9`: setup-uv publishes no major tags past v8.
      # `prune-cache` restates the pre-v9 default, which this repo wants — an unpruned
      # torch cache would crowd out the checkpoint cache below.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: |
          uv venv --python 3.11
          uv pip install --index-strategy unsafe-best-match \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -e ".[dev]"

      - name: Restore the demo checkpoint
        id: ckpt
        uses: actions/cache@v6
        with:
          path: pages-out
          # Keyed on everything that determines the trained weights: the config, the
          # model and training code, the corpus, and the step budget. Anything else
          # changing cannot alter the checkpoint, so it should not force a retrain.
          key: >-
            viz-demo-v1-${{ env.DEMO_STEPS }}x${{ env.DEMO_TOKENS_PER_STEP }}-${{
            hashFiles('configs/debug.yaml', 'src/llmfs/model/**', 'src/llmfs/train/**',
                      'src/llmfs/data/**', 'data/wizard_of_oz.txt') }}

      - name: Prepare corpus
        if: steps.ckpt.outputs.cache-hit != 'true'
        run: |
          uv run llmfs-prepare-data --source text \
            --input data/wizard_of_oz.txt --out-dir data/wizard --shard-tokens 40000

      - name: Train the demo model
        if: steps.ckpt.outputs.cache-hit != 'true'
        run: |
          uv run llmfs-train --config debug \
            --set runtime.device=cpu \
            --set train.max_steps=${{ env.DEMO_STEPS }} \
            --set train.tokens_per_step=${{ env.DEMO_TOKENS_PER_STEP }} \
            --set log.eval_interval=100 --set log.tensorboard=false \
            --set log.out_dir=pages-out

      - name: Build the explorer
        # Now served under /attention/ so the interactive site can hold the root. It
        # stays a separate single-file page rather than becoming a React route: the
        # claim that it needs no build step, no CDN and no backend is worth keeping
        # literally true, and a test asserts it references nothing external.
        run: |
          uv run llmfs-viz --checkpoint pages-out/debug/best.pt \
            --out site/attention/index.html --device cpu

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the site's dependencies
        run: npm ci --prefix web

      - name: Publish measured results to the site
        # The results pages read these at runtime and render an explicit "not published
        # yet" state when one is missing, so a run that has not happened yet produces an
        # honest page rather than a broken one or a fabricated table.
        #
        # The whole directory rather than a named list: this step and the dev server's
        # equivalent in web/vite.config.ts have to agree about what the site can fetch,
        # and two hand-maintained lists in two languages would not stay agreed.
        run: |
          mkdir -p web/public/data
          cp results/*.json web/public/data/
          echo "published $(ls -1 web/public/data | wc -l) results files"

      # The deploy gate. This workflow triggers on push to main independently of ci.yml,
      # so without these two steps a red suite would publish anyway — and the site's whole
      # claim is that its figures are the tested ones. Both suites are fast (seconds), and
      # they run here rather than being inferred from a green tick on another workflow.
      - name: Tests must pass before anything is published
        env:
          LLMFS_REQUIRE_VOCAB: "1"
        run: |
          uv run pytest tests -q
          npm test --prefix web
          npm run check:counts --prefix web

      - name: Build the site
        run: npm run build --prefix web

      - name: Assemble the deployment
        run: cp -r web/dist/. site/

      # v4 onward excludes hidden files from the artifact; the assembled site has
      # none, so no `include-hidden-files` is needed here.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
